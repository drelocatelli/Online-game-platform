<!doctype html>

<style>
  *,
  body {
    margin: 0;
    padding: 0;
  }

  canvas {
    background: transparent;
  }

  #game {
    position: relative;
    overflow: hidden;
    width: max-content;
  }

  #boards {
    position: absolute;
    right: 15px;
    top: 15px;
    font-size: 24px;
    color: #fff;
    text-shadow:
      0px 1px 1px #000,
      0px -1px 1px #000,
      1px 0px 1px #000,
      -1px 0px 1px #000;
      display: flex;
      gap: 5px;
  }

  #score-board {

  }
</style>

<div id="game">
  <div id="boards">
    <div id="score-board">$<span id="score-val">0</span></div>
    <!-- <div id="bullet-board"><span id="bullet-val">false</span></div> -->
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<!-- SDK do Socket.IO servido automaticamente pelo Node.js -->
<script src="/socket.io/socket.io.js"></script>
<!-- lib de gifs no canvas-->
<script src="https://cdn.jsdelivr.net/npm/gifler@0.1.0/gifler.min.js"></script>
<script src="/game.js"></script>
